<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alan's Terminal in TRON | Movie Terminals</title>
  <meta name="description" content="Sit at Alan Bradley's ENCOM terminal from TRON (1982) and try to start the Tron program before the MCP notices.">
  <meta name="theme-color" content="#000205">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&display=swap">
  <link rel="stylesheet" href="../assets/css/terminal.css">
  <link rel="stylesheet" href="../assets/css/tron-alan.css">
  <script src="../assets/js/terminal.js" defer></script>
  <script src="../assets/js/tron-alan.js" defer></script>
</head>

<body>
  <div id="screen">
    <div id="display" role="log" aria-label="Terminal output">
      <noscript>
        <p>ADDRESS FILE EMPTY<br>TRON PROGRAM UNAVAILABLE<br>JAVASCRIPT REQUIRED FOR TERMINAL ACCESS</p>
      </noscript>
    </div>
    <form id="inputline" autocomplete="off" hidden>
      <div class="prompt-lead"></div>
      <label class="prompt-line"><span class="prompt"></span><span class="field"><input id="command" type="text"
            aria-label="Command" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
            enterkeyhint="send"><span id="cursor" aria-hidden="true"></span></span></label>
    </form>
  </div>
  <img src="../assets/images/tron/encom_small.png" id="encom" alt="ENCOM" width="149" height="50">
  <footer id="credit">
    <nav>
      <a href="../">Movie Terminals</a>
      <a href="reference/">Command reference</a>
    </nav>
    <p><cite>TRON</cite> &copy; Walt Disney Productions, 1982. Terminal based on the xkcd CLI by
      <a href="https://chromakode.com">Chromakode</a>, after CLI2 by Rod McFarland.
      <a href="https://github.com/sdball/movieterminals">Source</a>.</p>
  </footer>
</body>

</html>
