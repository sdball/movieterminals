<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alien | Movie Terminals</title>
  <meta name="description" content="Query MU-TH-UR, the Nostromo's computer from Alien (1979), and find out what Special Order 937 says.">
  <meta name="theme-color" content="#010703">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="../assets/css/terminal.css">
  <link rel="stylesheet" href="../assets/css/alien.css">
  <script src="../assets/js/terminal.js" defer></script>
  <script src="../assets/js/alien.js" defer></script>
</head>

<body>
  <div id="screen">
    <div id="display" role="log" aria-label="Terminal output">
      <noscript>
        <p>INTERFACE 2037 OFFLINE</p>
        <p>JAVASCRIPT REQUIRED FOR INQUIRY</p>
      </noscript>
    </div>
    <form id="inputline" autocomplete="off" hidden>
      <div class="prompt-lead"></div>
      <label class="prompt-line"><span class="prompt"></span><span class="field"><input id="command" type="text"
            aria-label="Command" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false"
            enterkeyhint="send"><span id="cursor" aria-hidden="true"></span></span></label>
    </form>
  </div>
  <footer id="credit">
    <nav>
      <a href="../">Movie Terminals</a>
      <a href="reference/">Command reference</a>
    </nav>
    <p><cite>Alien</cite> &copy; 20th Century Fox, 1979. Terminal based on the xkcd CLI by
      <a href="https://chromakode.com">Chromakode</a>, after CLI2 by Rod McFarland.
      <a href="https://github.com/sdball/movieterminals">Source</a>.</p>
  </footer>
</body>

</html>
